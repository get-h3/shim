name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - name: Lint
        run: .venv/bin/python -m ruff check src/ tests/

      - name: Build check
        run: .venv/bin/python -c "import h3_shim"

      - name: Unit tests
        run: .venv/bin/python -m pytest -x --tb=short -q

      # GAP-043 — THE GATE: 44-test compliance battery against a live
      # scaffolded harness. Self-contained: the harness is scaffolded from
      # this repo's own py template — no external get-h3/sdk-go checkout.
      # Fails the build on h3-test exit 1 (compliance) or 2 (unreachable).
      - name: Compliance gate (44-test battery)
        run: bash scripts/test_battery.sh

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shim
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      # GAP-043 — the compliance gate is fully self-contained (no sdk-go
      # checkout): scripts/test_battery.sh scaffolds a fresh Python harness
      # from the shim's own templates, starts it, runs the 44-test battery,
      # and asserts TOTAL 44/44 PASSED + exit 0.
      - name: Run compliance gate (44-test battery)
        run: bash scripts/test_battery.sh

  scaffold-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install shim
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - name: Scaffold fresh Go harness
        run: .venv/bin/hermes-h3 scaffold --lang go --output-dir scaffold-check

      - name: Build scaffolded harness
        run: |
          cd scaffold-check/h3-harness-go
          go mod tidy
          go build .

      - name: Start scaffolded harness
        run: |
          nohup ./scaffold-check/h3-harness-go/h3-harness-go > /tmp/h3-harness-go.log 2>&1 &
          echo $! > /tmp/h3-harness-go.pid

      - name: Wait for harness
        run: sleep 2 && curl --retry 5 --retry-delay 1 --fail http://localhost:9191/v1/health

      - name: Run scaffold compliance gate
        run: .venv/bin/h3-test --endpoint http://localhost:9191

      - name: Kill scaffolded harness
        if: always()
        run: |
          kill $(cat /tmp/h3-harness-go.pid) 2>/dev/null || true
