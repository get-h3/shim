name: Sync Protocol

on:
  repository_dispatch:
    types: [protocol-updated]
  # PROTO-CI-002: allow manual re-runs (dispatch-only workflow; the
  # repository_dispatch fires only when protocol republishes)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout shim
        uses: actions/checkout@v4

      - name: Checkout protocol
        uses: actions/checkout@v4
        with:
          repository: get-h3/protocol
          path: protocol-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shim
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - name: Sync check — verify schema compatibility
        run: .venv/bin/python scripts/sync_protocol.py --schema-dir protocol-src/schemas/v1 --diff

      - name: Run unit tests
        run: .venv/bin/python -m pytest -x --tb=short -q

      - name: Checkout sdk-go
        uses: actions/checkout@v4
        with:
          repository: get-h3/sdk-go
          path: sdk-go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Go echo harness
        run: |
          cd sdk-go/examples/echo
          go build -o echo-server .

      - name: Start echo server
        run: |
          nohup ./sdk-go/examples/echo/echo-server > /tmp/echo-server.log 2>&1 &
          echo $! > /tmp/echo-server.pid

      - name: Wait for server
        run: sleep 2 && curl --retry 5 --retry-delay 1 http://localhost:9191/health

      - name: Run compliance tests
        run: .venv/bin/h3-test --endpoint http://localhost:9191

      - name: Kill echo server
        if: always()
        run: kill $(cat /tmp/echo-server.pid) 2>/dev/null || true

      - name: Read protocol version
        id: version
        # PROTO-CI-002: versions.yaml is a compatibility MATRIX (per-row
        # protocol cells, no top-level protocol key) — the old
        # `grep -A1 'protocol:' | tail -1` extracted a matrix cell
        # ("2.x.x") and minted the bogus tag v2.0.x.0. Derive the
        # version from protocol-src's newest release tag instead
        # (family convention: v1.1.0 => shim tag v1.1.0.0).
        run: |
          PROTO_VER=$(git -C protocol-src describe --tags --abbrev=0 | sed 's/^v//')
          echo "protocol_version=${PROTO_VER}" >> $GITHUB_OUTPUT
          echo "Protocol version: ${PROTO_VER}"

      - name: Tag release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          TAG="v${{ steps.version.outputs.protocol_version }}.0"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping (idempotent re-run)."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Build package
        run: .venv/bin/pip install build && .venv/bin/python -m build

      # PROTO-CI-002: trusted publishing was never configured on PyPI
      # (invalid-publisher, env MISSING) and the project already exists, so a
      # pending-publisher route is unusable. Publish with the PYPI_API_TOKEN
      # repo secret instead — and version-gate the upload: PyPI rejects
      # re-uploads of an existing release with HTTP 400, and 0.1.0 is already
      # live (2026-09-22). A Sync Protocol run must stay green when the
      # version did not change.
      - name: Publish to PyPI (version-gated)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          PKG_VER=$(.venv/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Package version: ${PKG_VER}"
          if curl -sf https://pypi.org/pypi/hermes-h3-shim/json | grep -q "\"version\":\"${PKG_VER}\""; then
            echo "Version ${PKG_VER} already published — skipping upload (PyPI rejects re-uploads)."
            exit 0
          fi
          .venv/bin/pip install twine
          .venv/bin/twine upload --non-interactive --disable-progress-bar dist/*
